services:
  #CONTENEDOR nginx
  nginx-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - svc-catalogo
      - svc-miembros
      - svc-prestamos
    networks:
      - microservices-net


  #CONTENEDOR MICROSERVICIO CATALOGO
  svc-catalogo:
    build: ./svc-catalogo
    ports:
      - "8091:8091"
    environment:  #aplication  propertis
      - REDIS_HOST=redis-cache
      - BD_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      - redis-cache
      - postgres
    networks:
      - microservices-net

  #CONTENEDOR MICROSERVICIO MIEMBROS
  svc-miembros:
    build: ./svc-miembros
    ports:
      - "8093:8093"
    environment:  #aplication  propertis
      - REDIS_HOST=redis-cache
      - BD_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      - redis-cache
      - postgres
    networks:
      - microservices-net



  #CONTENEDOR MICROSERVICIO PRESTAMOS
  svc-prestamos:
    build: ./svc-prestamos
    ports:
      - "8092:8092"
    environment:  #aplication  propertis
      - REDIS_HOST=redis-cache
      - BD_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=postgres
    depends_on:
      - redis-cache
      - postgres
    networks:
      - microservices-net

  #contenedor redis

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - microservices-net

  #CONTENEDOR POSTGRES

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"  #cuando no tienes instalado postgres de forma local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge #red virtual

volumes:
  postgres_data: